<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="many" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,4 L9,0 M0,4 L9,4 M0,4 L9,8" fill="none" stroke="#222" stroke-width="1"/>
    </marker>
    <marker id="one" markerWidth="6" markerHeight="8" refX="3" refY="4" orient="auto">
      <path d="M3,0 L3,8" fill="none" stroke="#222" stroke-width="1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="400" fill="#ffffff"/>

  <!-- ===== receiver ===== -->
  <rect x="40" y="52" width="196" height="98" fill="#ffffff" stroke="#40607f" stroke-width="1.4"/>
  <line x1="40" y1="80" x2="236" y2="80" stroke="#40607f" stroke-width="1"/>
  <text x="52" y="72" font-size="13" fill="#222">receiver</text>
  <g font-family="'DejaVu Sans Mono',monospace" font-size="9.5" fill="#3a3630">
    <text x="52" y="98">id            PK</text>
    <text x="52" y="112">name          UQ</text>
    <text x="52" y="126">lat · lon · alt_m</text>
    <text x="52" y="140">active · notes</text>
  </g>

  <!-- ===== contact ===== -->
  <rect x="40" y="234" width="196" height="140" fill="#ffffff" stroke="#40607f" stroke-width="1.4"/>
  <line x1="40" y1="262" x2="236" y2="262" stroke="#40607f" stroke-width="1"/>
  <text x="52" y="254" font-size="13" fill="#222">contact</text>
  <g font-family="'DejaVu Sans Mono',monospace" font-size="9.5" fill="#3a3630">
    <text x="52" y="280">id            PK</text>
    <text x="52" y="294">domain        UQ1</text>
    <text x="52" y="308">identifier    UQ1</text>
    <text x="52" y="322">name</text>
    <text x="52" y="336">first_seen</text>
    <text x="52" y="350">last_seen</text>
    <text x="52" y="364">details       JSONB</text>
  </g>

  <!-- ===== position ===== -->
  <rect x="368" y="92" width="264" height="216" fill="#ffffff" stroke="#9c5b3b" stroke-width="1.6"/>
  <line x1="368" y1="120" x2="632" y2="120" stroke="#9c5b3b" stroke-width="1"/>
  <text x="380" y="112" font-size="13" fill="#222">position</text>
  <g font-family="'DejaVu Sans Mono',monospace" font-size="9.5" fill="#3a3630">
    <text x="380" y="140">ts              partition</text>
    <text x="380" y="154">contact_id      FK</text>
    <text x="380" y="168">domain</text>
    <text x="380" y="182">receiver_id     FK  null</text>
    <text x="380" y="196">method</text>
    <text x="380" y="210">lat · lon</text>
    <text x="380" y="224">alt_m</text>
    <text x="380" y="238">speed_mps</text>
    <text x="380" y="252">course_deg</text>
    <text x="380" y="266">heading_deg</text>
    <text x="380" y="280">rssi_dbm</text>
    <text x="380" y="294">raw             JSONB</text>
  </g>

  <!-- ===== relations ===== -->
  <polyline points="236,108 300,108 300,150 364,150" fill="none" stroke="#222" stroke-width="1"
            stroke-dasharray="4 3" marker-start="url(#one)" marker-end="url(#many)"/>

  <polyline points="236,300 300,300 300,240 364,240" fill="none" stroke="#222" stroke-width="1"
            marker-start="url(#one)" marker-end="url(#many)"/>
</svg>
